<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Machine State Model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="state-off">
  <header>
    <h1>Coffee Machine</h1>
    <p class="subtitle">A state model of a single-serve drip coffee maker &middot; MSTU Appliance Doodle</p>
  </header>

  <main>
    <section class="machine" aria-label="Coffee machine">
      <div class="machine-top">
        <div class="reservoir">
          <span class="reservoir-label">Water</span>
          <div class="gauge"><div id="waterFill" class="gauge-fill water"></div></div>
          <span id="waterText" class="reservoir-value">600 ml</span>
        </div>
        <div class="reservoir">
          <span class="reservoir-label">Beans</span>
          <div class="gauge"><div id="beansFill" class="gauge-fill beans"></div></div>
          <span id="beansText" class="reservoir-value">40 g</span>
        </div>
      </div>

      <div class="panel">
        <div class="screen">
          <div class="screen-row">
            <span id="statusText" class="status">OFF</span>
            <span class="temp"><span id="tempText">20</span>&deg;C</span>
          </div>
          <div id="messageText" class="message">Press Power to start.</div>
          <div class="progress"><div id="brewBar" class="progress-bar"></div></div>
        </div>
        <div class="lights">
          <span class="light" id="lightPower">Power</span>
          <span class="light" id="lightHeating">Heating</span>
          <span class="light" id="lightReady">Ready</span>
          <span class="light warn" id="lightWater">Water</span>
          <span class="light warn" id="lightBeans">Beans</span>
        </div>
      </div>

      <div class="brew-area">
        <div class="spout"></div>
        <div id="stream" class="stream"></div>
        <div id="cup" class="cup medium">
          <div id="cupFill" class="cup-fill"></div>
        </div>
        <div class="drip-tray"></div>
      </div>
    </section>

    <section class="controls" aria-label="Controls">
      <h2>Controls</h2>
      <div class="button-row">
        <button id="powerBtn" class="big power">Power</button>
        <button id="brewBtn" class="big brew">Brew</button>
      </div>

      <label class="field">
        <span>Cup size</span>
        <select id="sizeSelect">
          <option value="espresso">Espresso cup (40 ml)</option>
          <option value="medium" selected>Mug (180 ml)</option>
          <option value="large">Travel mug (300 ml)</option>
        </select>
      </label>

      <label class="field">
        <span>Strength: <strong id="strengthText">3</strong> / 5</span>
        <input id="strengthRange" type="range" min="1" max="5" value="3">
      </label>

      <p id="needsText" class="hint"></p>

      <div class="button-row small-buttons">
        <button id="cupBtn">Remove cup</button>
        <button id="waterBtn">Refill water</button>
        <button id="beansBtn">Refill beans</button>
      </div>
    </section>

    <section class="log" aria-label="State log">
      <h2>State log</h2>
      <p class="hint">Every time the machine changes state, it is written here with the reason.</p>
      <ol id="logList"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
